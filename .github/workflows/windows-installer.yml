name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "desktop/**"
      - "extension/core/scheduler.mjs"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Build Windows installer
        run: pnpm desktop:dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-creator-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
